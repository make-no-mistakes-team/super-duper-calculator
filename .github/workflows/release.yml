name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up local environment and dependencies
        run: make setup
      - name: Check tagged source
        run: make check
      - name: Build application
        run: make build
      - name: Package executable and web assets
        run: tar -czf calculator-linux-amd64.tar.gz -C bin calculator web
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: calculator-linux-amd64
          path: calculator-linux-amd64.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: calculator-linux-amd64
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" calculator-linux-amd64.tar.gz --verify-tag --generate-notes
