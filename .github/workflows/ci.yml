name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up local environment and dependencies
        run: make setup
      - name: Check Go and web
        run: make check
      - name: Install Chromium and browser system dependencies
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - name: Check real browser, Go service, and SQLite
        run: make check-browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: browser-failure
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
